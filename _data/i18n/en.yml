manifesto: To understand letters, share them, and use them in ways that connect communities and cultures.
intro: >
  Akuru Collective is a type community in Sri Lanka. The word
  <em>Akuru</em> means "letters", and the collective brings together creators,
  researchers and the public around type research, modern innovation and the
  preservation of historical scripts.
